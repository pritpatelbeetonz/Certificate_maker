name: certificate_maker
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_svg: ^2.0.0
  path_provider: ^2.0.0
  dotted_border: ^3.1.0
  flutter_colorpicker: ^1.1.0
  image_picker: ^1.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  pdf: ^3.10.8
  open_filex: ^4.5.0


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/index.json
    - assets/bg/
    - assets/thumbnails/
    - assets/cert_jsons/

  uses-material-design: true

  fonts:
    - family: LibreBodoni
      fonts:
        - asset: assets/fonts/LibreBodoni-VariableFont_wght.ttf
    - family: LoveYaLikeASister
      fonts:
        - asset: assets/fonts/LoveYaLikeASister-Regular.ttf
    - family: OoohBaby
      fonts:
        - asset: assets/fonts/OoohBaby-Regular.ttf

